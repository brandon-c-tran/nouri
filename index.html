const icon=(name,size=19)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.heart}</svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`;
const today=()=>new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const dateFmt=iso=>new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const relative=iso=>{let d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);return d===0?'Today':d===1?'Yesterday':d<7?`${d}d ago`:dateFmt(iso)};
const seed=()=>({schemaVersion:1,createdAt:new Date().toISOString(),ideas:STARTERS.map((x,i)=>({...x,id:'starter'+i,createdAt:new Date(Date.now()-i*21600000).toISOString(),source:'starter',want:4,photoId:null})),plans:[],meals:[],cook:null,groceries:{extras:[],checked:[]},events:[],settings:{},visits:[]});
function load(){try{const parsed=JSON.parse(localStorage.getItem(KEY));if(parsed&&parsed.schemaVersion===1)return parsed;}catch{}return seed()}
let state=load();
const rt={view:'home',time:'all',mood:'any',dismissed:[],decisionStart:Date.now(),modal:null,shelfFilter:'all',journalFilter:'all',stepFilter:'prep',captureStart:null,mealLogStart:null};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
let idbPromise;
function getDb(){if(!('indexedDB' in window))return Promise.reject(Error('IndexedDB unavailable'));if(idbPromise)return idbPromise;idbPromise=new Promise((res,rej)=>{let request=indexedDB.open('nouri_images_v1',1);request.onupgradeneeded=()=>request.result.createObjectStore('images');request.onerror=()=>rej(request.error);request.onsuccess=()=>res(request.result);});return idbPromise}
async function storePhoto(id,blob){const db=await getDb();return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,id);tx.oncomplete=()=>res(id);tx.onerror=()=>rej(tx.error)})}
async function readPhoto(id){if(!id)return null;try{const db=await getDb();return await new Promise((res,rej)=>{const r=db.transaction('images').objectStore('images').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch{return null}}
async function allPhotos(){try{let db=await getDb();return await new Promise((res,rej)=>{let r=db.transaction('images').objectStore('images').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch{return []}}
async function removePhoto(id){if(!id)return;const db=await getDb();return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function processPhoto(file){if(!file||!file.type.startsWith('image/'))return null;const objectUrl=URL.createObjectURL(file);try{const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=objectUrl;});const max=1400,scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',.8));const id=uid();await storePhoto(id,blob);return id;}finally{URL.revokeObjectURL(objectUrl)}}
async function hydratePhotos(){document.querySelectorAll('[data-photo]').forEach(async el=>{const id=el.dataset.photo,blob=await readPhoto(id);if(blob&&!el.dataset.loaded){const url=URL.createObjectURL(blob);el.dataset.loaded='1';const placeholder=el.querySelector(':scope > .emoji, :scope > span:not(.source-badge)');if(placeholder)placeholder.remove();const img=document.createElement('img');img.src=url;img.alt='Food photo';img.onload=()=>URL.revokeObjectURL(url);el.prepend(img);}})}
const photoHTML=(photoId,emoji='🍽️',cls='thumb')=>`<div class="${cls}" ${photoId?`data-photo="${esc(photoId)}"`:''}><span class="emoji">${esc(emoji)}</span></div>`;
const starterName=idea=>idea.source==='starter'?'Starter idea':idea.source==='restaurant'?'From eating out':idea.source==='video'?'From a video':idea.source==='craving'?'Craving':'Saved idea';
function weekCount(){const start=Date.now()-7*86400000;return state.meals.filter(m=>new Date(m.createdAt).getTime()>start)}
function avgRate(meals){const vals=meals.filter(m=>m.rating).map(m=>Number(m.rating));return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'—'}
function nonRepeats(){const known=new Set();let count=0;[...state.meals].reverse().forEach(m=>{const title=m.title.toLowerCase().trim();if(!known.has(title)){known.add(title);count++;}});return count}
function captureEvent(type,payload={}){state.events.push({id:uid(),type,at:new Date().toISOString(),...payload});save()}
function recordVisit(){let d=new Date().toISOString().slice(0,10);if(!state.visits.includes(d)){state.visits.push(d);save()}}
recordVisit();
function rankIdeas(){const recent=new Set(state.meals.filter(m=>Date.now()-new Date(m.createdAt).getTime()<7*86400000).map(m=>m.title.toLowerCase()));const done=new Set(state.meals.map(m=>m.ideaId).filter(Boolean));return state.ideas.filter(x=>!rt.dismissed.includes(x.id)).map((x)=>{let score=(x.want||3)*1.5;const fit=(rt.time==='quick'?(x.minutes<=30?4:-4):rt.time==='project'?(x.minutes>=60?4:-2):0);score+=fit;if(rt.mood==='explore')score+=(done.has(x.id)?-2:3)+(x.tags?.includes('explore')?2:0);if(rt.mood==='comfort')score+=(x.tags?.includes('comfort')?3:0);if(recent.has(x.title.toLowerCase()))score-=3;if(state.plans.includes(x.id))score-=1;const freshness=Math.max(0,7-(Date.now()-new Date(x.createdAt).getTime())/86400000);score+=freshness*.18;return {...x,rank:score,whyRank:rt.mood==='explore'&&!done.has(x.id)?'Something new for you':rt.time==='quick'&&x.minutes<=30?'Fits a quick night':rt.mood==='comfort'&&x.tags?.includes('comfort')?'Your comfort lane':x.source==='starter'?'A place to start':'You saved this spark'};}).sort((a,b)=>b.rank-a.rank||a.title.localeCompare(b.title))}
const foodCard=idea=>`<article class="food-card" data-action="detail" data-id="${esc(idea.id)}" tabindex="0" role="button" aria-label="View ${esc(idea.title)}">

function renderShelf(){const list=state.ideas.filter(x=>rt.shelfFilter==='all'||(rt.shelfFilter==='mine'?x.source!=='starter':x.effort===rt.shelfFilter)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return `<header class="page-head"><div class="eyebrow">KEEP THE SPARK</div><h1>Craving shelf<span style="color:#adc690">.</span></h1><p>That late-night TikTok, the unforgettable restaurant dish, the thing you swore you'd cook someday. It all lives here.</p></header>
  <div class="toolbar"><div class="chip-row">${[['all','All ideas'],['mine','My saves'],['easy','Quick'],['project','Projects']].map(([v,l])=>`<button class="chip ${rt.shelfFilter===v?'is-active':''}" data-action="shelf-filter" data-value="${v}">${l}</button>`).join('')}</div><button class="btn btn-primary btn-sm" data-action="open-add">${icon('plus',15)} Save</button></div>
  ${list.length?`<div class="shelf-grid">${list.map(foodCard).join('')}</div>`:`<div class="surface empty-state"><div class="big">🌱</div><h3>A little room to grow</h3><p>Save something you're excited to eat.</p><button class="btn btn-secondary" data-action="open-add">Add inspiration</button></div>`}`}
function allGroceries(){const items=[];for(const id of state.plans){const idea=state.ideas.find(x=>x.id===id);if(!idea)continue;for(const raw of (idea.ingredients||[])){const value=raw.trim();if(value&&!items.some(e=>e.name.toLowerCase()===value.toLowerCase()))items.push({id:'ingredient:'+value.toLowerCase(),name:value,source:'From your lineup'})}}for(const x of state.groceries.extras)if(!items.some(e=>e.name.toLowerCase()===x.toLowerCase()))items.push({id:'extra:'+x.toLowerCase(),name:x,source:'Added by you'});return items}
function renderPlan(){const planned=state.plans.map(id=>state.ideas.find(x=>x.id===id)).filter(Boolean),groceries=allGroceries(),unchecked=groceries.filter(x=>!state.groceries.checked.includes(x.id)).length;return `<header class="page-head"><div class="eyebrow">THE FLEXIBLE LINEUP</div><h1>A week of good options<span style="color:#adc690">.</span></h1><p>Build a menu of possibilities, not a rigid calendar. Pivot when your cravings do.</p></header><div class="grid-two">

function renderJournal(){const meals=state.meals.filter(x=>rt.journalFilter==='all'||x.type===rt.journalFilter).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return `<header class="page-head"><div class="eyebrow">YOUR FOOD STORY</div><h1>Every bite is a memory<span style="color:#adc690">.</span></h1><p>Cooking experiments, restaurant discoveries, work lunches — one photographic history of what you actually enjoy.</p></header>
  <div class="toolbar"><div class="chip-row">${[['all','All'],['home','Cooked'],['restaurant','Eating out'],['work','Work'],['other','Other']].map(([v,l])=>`<button class="chip ${rt.journalFilter===v?'is-active':''}" data-action="journal-filter" data-value="${v}">${l}</button>`).join('')}</div><button class="btn btn-primary btn-sm" data-action="log-meal">${icon('plus',14)} Log meal</button></div>
  ${state.cook?`<div class="metric-notice" style="margin-bottom:17px"><b>You're in the middle of ${esc(state.cook.title)}.</b> Add a step or finish your cook. <button class="link-btn" data-action="cook-open">Continue cooking ${icon('arrow-up-right',14)}</button></div>`:''}
  ${meals.length?`<div class="journal-list">${meals.map(x=>`<article class="surface journal-item" data-action="meal-detail" data-id="${esc(x.id)}" tabindex="0" role="button">${photoHTML(x.photoId,x.emoji||'🍽️')}<div style="flex:1;min-width:0"><div class="tiny muted">${relative(x.createdAt)} · ${x.type==='home'?'Home-cooked':x.type==='restaurant'?'Restaurant':x.type==='work'?'Work meal':'Meal'}</div><h3>${esc(x.title)}</h3><p>${esc(x.place||x.note||x.cuisine||'A meal to remember')}</p><div>${x.rating?`<span class="journal-stars">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</span>`:'<span class="tag">Unrated</span>'}</div></div></article>`).join('')}</div>`:`<div class="surface empty-state"><div class="big">📖</div><h3>Your story starts with a meal</h3><p>Log something you cooked, enjoyed at a restaurant, or ate at work. Photos and honest impressions make it richer.</p><button class="btn btn-secondary" data-action="log-meal">Log your first meal</button></div>`}`}
function renderInsights(){const last=weekCount(),ratings=state.meals.filter(x=>x.rating),total=state.meals.length,meals14=state.meals.filter(x=>Date.now()-new Date(x.createdAt).getTime()<14*86400000),cuisines=new Set(meals14.map(x=>x.cuisine?.trim().toLowerCase()).filter(Boolean));const choices=state.events.filter(x=>x.type==='choice');const decisionTimes=choices.filter(x=>x.durationSeconds!=null).map(x=>x.durationSeconds).sort((a,b)=>a-b);const median=decisionTimes.length?Math.round(decisionTimes[Math.floor(decisionTimes.length/2)]):null;const meaningfulWeeks=new Set(state.events.filter(x=>['choice','meal_logged','cook_finished','planned'].includes(x.type)).map(x=>{const d=new Date(x.at);let first=new Date(d);first.setDate(d.getDate()-((d.getDay()+6)%7));return first.toISOString().slice(0,10)})).size;const personalIdeas=state.ideas.filter(x=>x.source!=='starter'),realizedIdeaIds=new Set(state.meals.map(m=>m.ideaId).filter(Boolean)),converted=personalIdeas.filter(x=>realizedIdeaIds.has(x.id)).length,ideaCaptureTimes=state.events.filter(e=>e.type==='idea_saved'&&Number.isFinite(e.durationSeconds)).map(e=>e.durationSeconds).sort((a,b)=>a-b),medianCapture=ideaCaptureTimes.length?ideaCaptureTimes[Math.floor(ideaCaptureTimes.length/2)]:null;
return `<header class="page-head"><div class="eyebrow">MORE JOY, LESS FRICTION</div><h1>Better food days<span style="color:#adc690">.</span></h1><p>You're not trying to maximize time spent in an app. You're trying to eat more meals you love and discover a wider world of food.</p></header>

function refresh(){const root=document.getElementById('view-root');root.innerHTML=({home:renderHome,shelf:renderShelf,plan:renderPlan,journal:renderJournal,insights:renderInsights}[rt.view]||renderHome)();document.querySelectorAll('.nav-link').forEach(n=>n.classList.toggle('is-active',n.dataset.view===rt.view));hydratePhotos()}

let toastTimeout;function toast(text){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(text)}</div>`;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>root.innerHTML='',2800)}
function decisionLog(seconds,ideaId,action){if(Number.isFinite(seconds)){captureEvent('choice',{ideaId,action,durationSeconds:Math.max(0,Math.min(3600,seconds))});rt.decisionStart=Date.now()}}
function planAdd(id,seconds){const x=state.ideas.find(x=>x.id===id);if(!x)return;if(!state.plans.includes(id))state.plans.push(id);decisionLog(seconds,id,'planned');captureEvent('planned',{ideaId:id});save();closeModal();refresh();toast('Added to your flexible week')}
function ideaFromMeal(id){const m=state.meals.find(x=>x.id===id);if(!m)return;const existing=state.ideas.find(x=>x.linkedMealId===m.id);if(existing){closeModal();openDetail(existing.id);return}const idea={id:uid(),title:m.title,emoji:'🍽️',cuisine:m.cuisine||'',minutes:40,effort:'medium',why:`Inspired by ${m.place||'this meal'}${m.note?': '+m.note:''}`,source:'restaurant',want:5,ingredients:[],url:'',photoId:m.photoId,linkedMealId:m.id,createdAt:new Date().toISOString()};state.ideas.unshift(idea);captureEvent('idea_saved',{ideaId:idea.id,fromMeal:m.id});closeModal();navigate('shelf');toast('Saved as a dish to recreate')}
function importFileClick(){const input=document.querySelector('#import-file');if(input)input.click()}
async function exportData(){const photoIds=await allPhotos();const photos={};for(const id of photoIds){const blob=await readPhoto(id);if(!blob)continue;photos[id]=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob)})}const data={exportedAt:new Date().toISOString(),app:'Nouri V0',state,photos};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`nouri-export-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Journal exported, including photos')}
async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data?.state||data.state.schemaVersion!==1||typeof data.photos!=='object')throw Error('Not a Nouri export');if(!confirm('Import this Nouri journal? Your current local journal will be replaced. Export a backup first.'))return;for(const [id,dataUrl] of Object.entries(data.photos)){if(typeof dataUrl!=='string'||!dataUrl.startsWith('data:image/'))continue;const response=await fetch(dataUrl);await storePhoto(id,await response.blob())}state=data.state;save();rt.view='insights';refresh();toast('Journal imported');}catch(e){alert('Could not import this file. '+e.message)}}
async function submitForm(form){const fd=new FormData(form);const field=k=>String(fd.get(k)||'').trim();const file=fd.get('photo');const photoId=file instanceof File&&file.size?await processPhoto(file):null;
 if(form.id==='add-idea'){const idea={id:uid(),title:field('title'),emoji:'🍽️',cuisine:field('cuisine'),minutes:Number(field('minutes'))||30,effort:field('effort')||'easy',why:field('why'),source:field('source')==='craving'&&/tiktok|instagram|youtube|pinterest|facebook|reddit/.test(field('url'))?'video':field('source')||'craving',want:5,ingredients:field('ingredients').split(',').map(s=>s.trim()).filter(Boolean),url:field('url'),photoId,createdAt:new Date().toISOString()};state.ideas.unshift(idea);captureEvent('idea_saved',{ideaId:idea.id,durationSeconds:rt.captureStart?Math.round((Date.now()-rt.captureStart)/1000):null});rt.captureStart=null;closeModal();refresh();toast('Saved to your craving shelf');return}
 if(form.id==='edit-idea'){const x=state.ideas.find(x=>x.id===form.dataset.id);if(!x)return;Object.assign(x,{title:field('title'),cuisine:field('cuisine'),minutes:Number(field('minutes'))||30,effort:field('effort'),why:field('why'),ingredients:field('ingredients').split(',').map(s=>s.trim()).filter(Boolean)});if(photoId)x.photoId=photoId;save();closeModal();refresh();toast('Updated');return}
 if(form.id==='log-meal'){const meal={id:uid(),title:field('title'),type:field('type'),cuisine:field('cuisine'),place:field('place'),note:field('note'),rating:Number(field('rating'))||null,photoId,createdAt:new Date().toISOString()};state.meals.push(meal);captureEvent('meal_logged',{mealId:meal.id,type:meal.type,rating:meal.rating,durationSeconds:rt.mealLogStart?Math.round((Date.now()-rt.mealLogStart)/1000):null});rt.mealLogStart=null;closeModal();refresh();toast('Meal added to your story');return}
 if(form.id==='add-step'){if(!state.cook)return;state.cook.steps.push({id:uid(),stage:field('stage'),note:field('note'),photoId,at:new Date().toISOString()});save();cookOpen();toast('Moment captured');return}
 if(form.id==='finish-cook'){if(!state.cook)return;const s=state.cook;const meal={id:uid(),cookId:s.id,ideaId:s.ideaId,title:s.title,type:'home',cuisine:field('cuisine'),note:field('note'),rating:Number(field('rating'))||null,photoId:photoId||s.steps.findLast(x=>x.photoId)?.photoId||null,createdAt:new Date().toISOString()};state.meals.push(meal);state.events.push({id:uid(),type:'cook_session',at:new Date().toISOString(),cookId:s.id,ideaId:s.ideaId,steps:s.steps,mealId:meal.id});state.cook=null;captureEvent('cook_finished',{mealId:meal.id,rating:meal.rating});closeModal();rt.view='journal';refresh();toast('Cook saved to your culinary memory');return}
 if(form.id==='add-grocery'){const value=field('item');if(value&&!state.groceries.extras.some(x=>x.toLowerCase()===value.toLowerCase()))state.groceries.extras.push(value);save();refresh();return}
}
async function handleAction(el,event){const action=el.dataset.action,id=el.dataset.id,value=el.dataset.value;switch(action){
case 'navigate':navigate(el.dataset.view);break;case 'open-add':openAdd();break;case 'close-modal':closeModal();break;case 'close-backdrop':if(event.target===el)closeModal();break;
case 'time-filter':rt.time=value;rt.dismissed=[];refresh();break;case 'mood-filter':rt.mood=value;rt.dismissed=[];refresh();break;case 'reset-picks':rt.dismissed=[];rt.time='all';rt.mood='any';rt.decisionStart=Date.now();refresh();break;case 'dismiss':rt.dismissed.push(id);refresh();break;
case 'shelf-filter':rt.shelfFilter=value;refresh();break;case 'journal-filter':rt.journalFilter=value;refresh();break;case 'detail':openDetail(id);break;case 'meal-detail':openMealDetail(id);break;case 'edit-idea':editIdea(id);break;
case 'delete-idea':{const x=state.ideas.find(x=>x.id===id);if(!x||!confirm(`Delete "${x.title}" from your shelf? Your meal history remains.`))return;state.ideas=state.ideas.filter(x=>x.id!==id);state.plans=state.plans.filter(x=>x!==id);save();closeModal();refresh();toast('Removed from shelf');break}
case 'choose':openChoose(id);break;
case 'plan-add':planAdd(id,el.dataset.seconds!==undefined?Number(el.dataset.seconds):undefined);break;case 'plan-remove':state.plans=state.plans.filter(x=>x!==id);save();refresh();toast('Removed from week');break;
case 'open-picker':picker();break;case 'swap':picker(id);break;case 'picker-add':{const replace=el.dataset.replace;if(replace)state.plans=state.plans.filter(x=>x!==replace);planAdd(id);break}
case 'grocery-check':{if(el.checked){if(!state.groceries.checked.includes(id))state.groceries.checked.push(id)}else state.groceries.checked=state.groceries.checked.filter(x=>x!==id);save();refresh();break}
case 'cook-start':{const x=state.ideas.find(x=>x.id===id);if(!x)return;if(state.cook&&!confirm('You have an unfinished cook. Replace it with this one?'))return;state.cook={id:uid(),ideaId:id,title:x.title,startedAt:new Date().toISOString(),steps:[]};decisionLog(el.dataset.seconds!==undefined?Number(el.dataset.seconds):undefined,id,'cook');save();cookOpen();toast('Your cooking session is ready');break}
case 'cook-open':cookOpen();break;case 'cook-finish':cookFinish();break;case 'log-meal':openLogMeal(el.dataset.title||'');break;
case 'recreate':ideaFromMeal(id);break;
case 'delete-meal':{const x=state.meals.find(x=>x.id===id);if(!x||!confirm(`Delete "${x.title}" from your journal?`))return;state.meals=state.meals.filter(x=>x.id!==id);save();closeModal();refresh();toast('Meal deleted');break}
case 'export':await exportData();break;case 'import':importFileClick();break;
}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;if(target.matches('a'))return;if(target.classList.contains('modal-backdrop')&&e.target!==target)return;if(target.matches('button')||target.matches('[role="button"]')||target.classList.contains('modal-backdrop')){e.preventDefault();handleAction(target,e).catch(err=>{console.error(err);toast('Something went wrong. Please try again.')})}});
document.addEventListener('change',e=>{const x=e.target;if(x.matches('[data-action="grocery-check"]'))handleAction(x,e);if(x.id==='import-file'&&x.files?.[0])importData(x.files[0])});
document.addEventListener('submit',e=>{if(e.target.matches('form')){e.preventDefault();const submit=e.submitter;if(submit)submit.disabled=true;submitForm(e.target).catch(err=>{console.error(err);toast('Could not save. Check your browser storage.');if(submit)submit.disabled=false})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-action]')){e.preventDefault();handleAction(e.target,e)}});

document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon)});
refresh();
})();
</script>
</body>
</html>
