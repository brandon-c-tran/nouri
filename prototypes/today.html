<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>Nouri Today Prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   Nouri Today: prototype harness, round 2 (more beauty + delight)
   Not production code. Lives outside index.html on purpose.
   ========================================================= */
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:#111;font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-top:100px}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
img,svg{display:block}
#stage{min-height:calc(100dvh - 100px)}
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1)}

.v{position:relative;min-height:calc(100dvh - 100px);max-width:430px;margin:0 auto;overflow:hidden;padding:env(safe-area-inset-top,0px) 0 calc(84px + env(safe-area-inset-bottom,0px))}
.v button:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}

/* Dish art: authored SVG flat-lays. Real photos replace them via "Use my photos". */
.photo{position:relative;overflow:hidden;background:var(--t1)}
.photo svg,.photo img{position:absolute;inset:0;width:100%;height:100%}
.photo img{object-fit:cover}
.steam path{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.steamy .steam path{animation:steam 3.8s ease-in-out infinite}
.steamy .steam path:nth-child(2){animation-delay:1.25s}
.steamy .steam path:nth-child(3){animation-delay:2.5s}
@keyframes steam{0%{opacity:0;transform:translateY(8px) scaleY(.8)}35%{opacity:.55}100%{opacity:0;transform:translateY(-18px) scaleY(1.15)}}

/* Toast with undo */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:6px;max-width:min(400px,calc(100% - 24px));padding:6px 6px 6px 16px;border-radius:999px;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:transform 220ms var(--ease-out),opacity 220ms var(--ease-out);font-size:14px;font-weight:650;box-shadow:0 10px 30px -8px rgba(0,0,0,.35)}
.toast.is-on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{min-height:44px;padding:0 14px;border:0;border-radius:999px;font-weight:800;flex:0 0 auto}

/* Adjust sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,10,.4);opacity:0;pointer-events:none;transition:opacity 240ms var(--ease-out)}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(430px,100%);padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;transform:translate(-50%,100%);transition:transform 320ms var(--ease-drawer);overscroll-behavior:contain}
.v.adjusting .scrim{opacity:1;pointer-events:auto}
.v.adjusting .sheet{transform:translate(-50%,0)}
.sheet .grab{width:38px;height:5px;border-radius:9px;margin:-6px auto 14px;background:currentColor;opacity:.2}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet p{margin:0 0 6px;font-size:14px;opacity:.78}
.sheet .grp{margin:14px 0 0}
.sheet .lbl{font-size:13px;font-weight:750;opacity:.75;margin-bottom:8px}
.sheet .opts{display:flex;gap:8px;flex-wrap:wrap}
.sheet .opt{min-height:44px;padding:0 16px;border-radius:999px;font-weight:750;font-size:15px;transition:transform 120ms var(--ease-out),background-color 160ms,color 160ms}
.sheet .opt:active{transform:scale(.96)}
.sheet .done{width:100%;min-height:52px;margin-top:20px;border:0;border-radius:16px;font-weight:800;font-size:16px}

/* Bottom nav */
.nav{position:fixed;left:50%;bottom:0;z-index:20;transform:translateX(-50%);width:min(430px,100%);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;border-radius:14px;transition:transform 120ms var(--ease-out)}
.nav button:active{transform:scale(.95)}
.nav svg{width:22px;height:22px}

.slot{position:relative}
.card{transition:transform 260ms var(--ease-out),opacity 220ms var(--ease-out)}

/* ================= A · Scallion & Plate ================= */
.v-a{--focus:#2f6b42;background:#f1f4ef;color:#13241a}
.v-a ::selection{background:#cfe5b4;color:#13241a}
.v-a .top{display:flex;align-items:center;gap:12px;padding:14px 16px 8px}
.v-a .top img{width:50px;height:50px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 4px 6px rgba(31,75,47,.18))}
.v-a h1{flex:1;margin:0;font-family:"Bricolage Grotesque",ui-rounded,sans-serif;font-weight:800;font-size:27px;line-height:1.02;letter-spacing:-.03em;font-variation-settings:"opsz" 48}
.v-a .add{width:44px;height:44px;border-radius:50%;border:0;background:#1d4a2e;color:#f1f7e8;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 14px -4px rgba(29,74,46,.45);transition:transform 120ms var(--ease-out)}
.v-a .add:active{transform:scale(.94)}
.v-a .panel{position:relative;margin:4px 10px 0;padding:12px 10px 10px;border-radius:34px 34px 28px 30px;background:#1d4a2e;color:#eef4e6;box-shadow:0 22px 40px -24px rgba(16,44,26,.7)}
.v-a .panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 50% at 30% 0%,rgba(190,230,150,.16),transparent 60%);}
.v-a .panel-head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px 8px}
.v-a .panel-head span{font-size:14px;font-weight:650;color:#c9dfb8}
.v-a .chip{min-height:44px;padding:0 14px 0 16px;border:0;border-radius:999px;background:#2b6141;color:#f2f7ea;font-weight:750;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform 120ms var(--ease-out)}
.v-a .chip:active{transform:scale(.96)}
.v-a .grid{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:236px 178px;gap:10px}
.v-a .slot{border-radius:24px;overflow:hidden}
.v-a .slot[data-slot="0"]{grid-column:1/3;border-radius:26px 26px 22px 22px}
.v-a .card{position:absolute;inset:0;overflow:hidden;background:var(--t1)}
.v-a .card .photo{position:absolute;inset:0 0 40px 0}
.v-a .slot:not([data-slot="0"]) .card .photo{inset:0 0 30px 0}
.v-a .strip{position:absolute;z-index:2;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:8px;padding:11px 8px 11px 14px;border-radius:18px;background:#f6f8f2;color:#13241a;box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}
.v-a .strip .t{flex:1;min-width:0}
.v-a .strip h3{margin:0;font-family:"Bricolage Grotesque",ui-rounded,sans-serif;font-size:20px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.v-a .strip p{margin:3px 0 0;font-size:13px;color:#4b5e4f;font-weight:600}
.v-a .strip .why{display:block;margin-top:3px;font-size:13px;color:#2b6141;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-a .choose{position:relative;min-height:44px;padding:0 16px;border:0;border-radius:14px;background:#1d4a2e;color:#fff;font-weight:800;font-size:15px;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;transition:transform 120ms var(--ease-out),background-color 200ms,color 200ms}
.v-a .choose:active{transform:scale(.95)}
.v-a .choose .ok{display:none}
.v-a .slot.is-chosen .choose{background:#a6d270;color:#13241a}
.v-a .slot.is-chosen .choose .ok{display:block}
.v-a .slot.is-chosen .choose .lb-go{display:none}
.v-a .lb-on{display:none}.v-a .slot.is-chosen .lb-on{display:inline}
.v-a .slot:not([data-slot="0"]) .strip{left:6px;right:6px;bottom:6px;padding:8px 6px 8px 11px;border-radius:15px}
.v-a .slot:not([data-slot="0"]) .strip h3{font-size:15px}
.v-a .slot:not([data-slot="0"]) .strip p{font-size:12px}
.v-a .slot:not([data-slot="0"]) .choose{width:44px;padding:0;justify-content:center}
.v-a .slot:not([data-slot="0"]) .choose .lb-on{display:none}
.v-a .skip{position:absolute;z-index:2;top:8px;right:8px;min-height:44px;padding:0 14px;border:0;border-radius:999px;background:rgba(12,26,16,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:750;transition:transform 120ms var(--ease-out)}
.v-a .slot:not([data-slot="0"]) .skip{width:44px;padding:0;display:grid;place-items:center}
.v-a .skip:active{transform:scale(.94)}
.v-a .tag{position:absolute;z-index:2;top:12px;left:12px;padding:6px 11px;border-radius:999px;background:#f6f8f2;color:#1d4a2e;font-size:12px;font-weight:800}
.v-a .peek{position:absolute;right:-8px;bottom:22%;width:60px;z-index:3;transform:translateX(115%) rotate(-6deg);transition:transform 240ms var(--ease-out);pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.28))}
.v-a .slot.nudging .peek{transform:translateX(16%) rotate(-16deg)}
.v-a .cheer{position:absolute;z-index:1;right:22px;bottom:46px;width:58px;transform:translateY(150px);pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.v-a .slot:not([data-slot="0"]) .cheer{width:44px;right:10px;bottom:34px}
.v-a .card.out{transform:translateX(-22px) scale(.98);opacity:0;transition-duration:180ms}
.v-a .card.in{transform:translateX(28px);opacity:0;transition:none}
.v-a.has-choice .slot:not(.is-chosen) .card{opacity:.6}
.v-a .note{display:flex;align-items:center;gap:8px;margin:12px 18px 0;font-size:14px;color:#4b5e4f;font-weight:600}
.confetti{position:fixed;z-index:60;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:3px solid #7fbf4d;background:#dff0c4;pointer-events:none}
.confetti.slice{border-color:#a6d270;background:#f3f9e8;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-width:2.5px}
.v-a .toast{background:#13241a;color:#fff}.v-a .toast button{background:#a6d270;color:#13241a}
.v-a .sheet{background:#f6f8f2;color:#13241a}
.v-a .opt{border:1px solid #d3ddcc;background:#fff;color:#1d4a2e}
.v-a .opt[aria-pressed="true"]{background:#1d4a2e;border-color:#1d4a2e;color:#fff}
.v-a .done{background:#1d4a2e;color:#fff}
.v-a .nav{background:rgba(241,244,239,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid #dfe6da;color:#5a6b5d}
.v-a .nav [aria-current]{color:#1d4a2e;background:#e1ecd4}

/* ================= B · Night Market ================= */
.v-b{--focus:#f2c879;background:#191411;color:#f3e7d3;background-image:radial-gradient(130% 55% at 50% -12%,#45291a 0,transparent 62%)}
.v-b ::selection{background:#f2c879;color:#191411}
.v-b .lights{position:absolute;top:0;left:0;width:100%;height:46px;pointer-events:none}
.v-b .lights .bulb{fill:#ffd88a}
.v-b .lights .halo{fill:rgba(255,190,90,.35)}
.v-b .top{position:relative;display:flex;align-items:flex-end;gap:12px;padding:22px 16px 2px}
.v-b .lantern{position:relative;width:52px;height:52px;flex:0 0 auto}
.v-b .lantern::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(240,160,70,.42),transparent 68%)}
.v-b .lantern img{position:relative;width:52px;height:52px;object-fit:contain}
.v-b .top .t{flex:1;min-width:0}
.v-b h1{margin:0;font-family:"Big Shoulders Display","Avenir Next Condensed",sans-serif;font-weight:900;font-size:33px;letter-spacing:.01em;text-transform:uppercase;line-height:.95;color:#fbefd9;text-shadow:0 0 18px rgba(255,170,80,.25)}
.v-b .top .sub{margin:3px 0 0;font-size:13px;color:#cdb795;font-weight:600}
.v-b .add{width:44px;height:44px;border-radius:50%;border:1px solid #4a3a2c;background:#241c17;color:#f2c879;display:grid;place-items:center;transition:transform 120ms var(--ease-out)}
.v-b .add:active{transform:scale(.94)}
.v-b .bar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px}
.v-b .bar span{font-size:13px;color:#b8a282;font-weight:600}
.v-b .chip{min-height:44px;padding:0 14px 0 16px;border-radius:999px;border:1px solid #5a432e;background:#2a201a;color:#f2c879;font-weight:750;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform 120ms var(--ease-out)}
.v-b .chip:active{transform:scale(.96)}
.v-b .rows{display:grid;gap:10px;padding:0 12px}
.v-b .slot{height:132px;touch-action:pan-y}
.v-b .card{position:absolute;inset:0;display:grid;grid-template-columns:112px 1fr;gap:13px;padding:10px;border-radius:22px;background:linear-gradient(180deg,#261e19,#211a16);border:1px solid #352920;transition:transform 260ms var(--ease-out),opacity 220ms var(--ease-out),box-shadow 300ms,border-color 300ms}
.v-b .card .photo{border-radius:15px;box-shadow:0 0 0 1px rgba(255,236,200,.08),0 14px 30px -10px var(--glow)}
.v-b .card .photo::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 10%,rgba(255,214,150,.2),transparent 70%);pointer-events:none}
.v-b .info{display:flex;flex-direction:column;min-width:0}
.v-b .sign{position:relative;align-self:flex-start;max-width:100%;padding:6px 11px 5px;border-radius:7px;background:var(--sign);color:#fdf1dc;box-shadow:inset 0 0 0 2px rgba(255,240,215,.2),0 6px 14px -8px rgba(0,0,0,.6);transform-origin:50% 50%;backface-visibility:hidden;transition:transform 240ms var(--ease-out)}
.v-b .sign h3{margin:0;font-family:"Big Shoulders Display","Avenir Next Condensed",sans-serif;font-size:23px;line-height:1;font-weight:900;text-transform:uppercase;letter-spacing:.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-b .bulbs{position:absolute;inset:-5px;border-radius:10px;padding:3px;opacity:0;pointer-events:none;background:radial-gradient(circle,#ffe6a3 0 1.7px,transparent 2.3px) 0 0/8px 8px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);filter:drop-shadow(0 0 3px rgba(255,200,110,.9));transition:opacity 200ms}
.v-b .slot.is-chosen .bulbs{opacity:1}
.v-b .meta{margin:7px 0 0;font-size:13px;color:#cdb795;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-b .acts{margin-top:auto;display:flex;gap:6px;align-items:center}
.v-b .choose{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:#f2c879;color:#2a1a0e;font-weight:850;font-size:14px;letter-spacing:.03em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;transition:transform 120ms var(--ease-out),background-color 200ms}
.v-b .choose:active{transform:scale(.95)}
.v-b .choose .ok{display:none}
.v-b .slot.is-chosen .choose{background:#fff1d2}
.v-b .slot.is-chosen .choose .ok{display:block}
.v-b .skip{min-height:44px;padding:0 12px;border:0;background:none;color:#cdb795;font-size:14px;font-weight:650}
.v-b .slot.is-chosen .skip{display:none}
.v-b .lit{display:none;margin-left:4px;font-size:13px;font-weight:800;color:#f2c879;letter-spacing:.08em;text-transform:uppercase}
.v-b .slot.is-chosen .lit{display:inline}
.v-b .slot.flipping .sign{transform:rotateX(90deg);transition:transform 150ms ease-in}
.v-b .slot.flipped-in .sign{transform:rotateX(-90deg);transition:none}
.v-b .card.out{transform:translateX(-110%);opacity:0;transition-duration:220ms}
.v-b .card.in{transform:translateX(40px);opacity:0;transition:none}
.v-b .card.dragging{transition:none}
.v-b .slot.is-chosen .card{border-color:#f2c879;box-shadow:0 0 0 1px #f2c879,0 0 34px -8px rgba(242,200,121,.6)}
.v-b.has-choice .slot:not(.is-chosen) .card{opacity:.5}
.v-b .toast{background:#f3e7d3;color:#191411}.v-b .toast button{background:#191411;color:#f2c879}
.v-b .sheet{background:#241c17;color:#f3e7d3}
.v-b .opt{border:1px solid #4a3a2c;background:#2a201a;color:#f3e7d3}
.v-b .opt[aria-pressed="true"]{background:#f2c879;border-color:#f2c879;color:#191411}
.v-b .done{background:#f2c879;color:#191411}
.v-b .nav{background:rgba(25,20,17,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid #352920;color:#ac977a}
.v-b .nav [aria-current]{color:#f2c879;background:#2a201a}

/* ================= C · Kitchen Table ================= */
.v-c{--focus:#24304f;color:#24304f;background-color:#e6eaee;background-image:
  repeating-linear-gradient(0deg,rgba(58,88,128,.07) 0 14px,transparent 14px 28px),
  repeating-linear-gradient(90deg,rgba(58,88,128,.07) 0 14px,transparent 14px 28px)}
.v-c ::selection{background:#fff3a0;color:#24304f}
.v-c .top{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 16px 0}
.v-c h1{margin:0;font-family:"Kalam","Bradley Hand","Noteworthy",cursive;font-weight:700;font-size:34px;line-height:1;color:#24304f}
.v-c .sub{margin:4px 0 0;font-size:14px;font-weight:600;color:#525d77}
.v-c .add{width:44px;height:44px;border-radius:50%;border:1.5px dashed #7f8dad;background:rgba(255,255,255,.65);color:#24304f;display:grid;place-items:center;flex:0 0 auto;transition:transform 120ms var(--ease-out)}
.v-c .add:active{transform:scale(.94)}
.v-c .chip{margin:10px 16px 0;min-height:44px;padding:0 14px 0 16px;border:0;border-radius:10px;background:#fffef8;color:#24304f;font-weight:750;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 6px 12px -4px rgba(36,48,79,.18);transform:rotate(-1deg);transition:transform 120ms var(--ease-out)}
.v-c .chip:active{transform:rotate(-1deg) scale(.96)}
.v-c .table{position:relative;height:440px;margin:8px 0 0}
.v-c .slot{position:absolute}
.v-c .slot[data-slot="0"]{left:10px;top:6px;width:214px;--r:-3deg;z-index:2}
.v-c .slot[data-slot="1"]{right:10px;top:0;width:156px;--r:4deg;z-index:1}
.v-c .slot[data-slot="2"]{right:12px;top:226px;width:166px;--r:-2deg;z-index:3}
.v-c .card{position:relative;background:#fffffb;padding:8px 8px 6px;border-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.08),0 14px 24px -8px rgba(36,48,79,.38);transform:rotate(var(--r))}
.v-c .card::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.0) 40%,rgba(255,255,255,.35) 50%,rgba(255,255,255,0) 60%)}
.v-c .card .photo{height:var(--ph,176px);border-radius:1px}
.v-c .slot[data-slot="1"] .card{--ph:118px}
.v-c .slot[data-slot="2"] .card{--ph:112px}
.v-c .cap{padding:6px 2px 0}
.v-c .cap h3{margin:0;font-family:"Kalam","Bradley Hand","Noteworthy",cursive;font-weight:700;font-size:19px;line-height:1.1;color:#24304f}
.v-c .cap p{margin:2px 0 0;font-family:"Kalam","Bradley Hand","Noteworthy",cursive;font-size:15px;line-height:1.15;color:#525d77}
.v-c .stamp{position:absolute;top:14px;right:12px;width:56px;height:56px;border-radius:50%;border:2.5px solid rgba(178,59,46,.85);color:rgba(178,59,46,.92);display:grid;place-items:center;text-align:center;font:700 13px/1 "Kalam",cursive;text-transform:uppercase;transform:rotate(12deg);background:rgba(255,255,255,.22);-webkit-mask:radial-gradient(circle at 30% 40%,#000 60%,rgba(0,0,0,.65) 61%) ;mask:radial-gradient(circle at 30% 40%,#000 60%,rgba(0,0,0,.65) 61%)}
.v-c .slot:not([data-slot="0"]) .stamp{width:48px;height:48px;font-size:12px;top:12px;right:10px}
.v-c .acts{display:flex;gap:6px;align-items:center;margin-top:4px}
.v-c .choose{min-height:44px;padding:0 11px;border:0;border-radius:8px;background:#24304f;color:#fffef8;font-weight:800;font-size:14px;transition:transform 120ms var(--ease-out)}
.v-c .choose:active{transform:scale(.95)}
.v-c .skip{min-height:44px;min-width:44px;padding:0 4px;white-space:nowrap;border:0;background:none;color:#525d77;font-family:"Kalam","Bradley Hand",cursive;font-size:16px;font-weight:700;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.v-c .tape{position:absolute;z-index:2;top:-12px;left:50%;width:84px;height:26px;background:rgba(222,206,128,.72);transform:translateX(-50%) rotate(-4deg);opacity:0;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.1);clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,16% 8%,20% 0,100% 0,96% 10%,100% 20%,96% 32%,100% 44%,96% 56%,100% 68%,96% 80%,100% 92%,96% 100%,0 100%,4% 90%,0 80%,4% 70%,0 60%,4% 50%,0 40%,4% 30%,0 20%)}
.v-c .slot.is-chosen .tape{opacity:1}
.v-c .tonight{position:absolute;bottom:-28px;left:6px;font-family:"Kalam","Bradley Hand",cursive;font-weight:700;font-size:22px;color:#b23b2e;transform:rotate(-6deg);clip-path:inset(0 100% 0 0);pointer-events:none}
.v-c .slot.is-chosen .tonight{clip-path:inset(0 0 0 0)}
.v-c.has-choice .slot:not(.is-chosen) .card{opacity:.62}
.v-c .card.out{transform:translate(120px,-30px) rotate(calc(var(--r) + 16deg));opacity:0;transition-duration:240ms}
.v-c .card.in{transform:translateY(-28px) rotate(calc(var(--r) - 7deg)) scale(1.04);opacity:0;transition:none}
.v-c .card.settle{transition:transform 380ms cubic-bezier(.34,1.4,.64,1),opacity 200ms var(--ease-out)}
.v-c .doodle{position:absolute;left:12px;top:338px;width:196px;display:flex;gap:8px;align-items:flex-end}
.v-c .doodle img{width:48px;transform:rotate(-6deg)}
.v-c .doodle p{margin:0;padding:9px 11px;background:#fff6b0;font-family:"Kalam","Bradley Hand",cursive;font-size:15px;line-height:1.15;color:#3b391e;transform:rotate(2deg);box-shadow:0 8px 14px -8px rgba(0,0,0,.35)}
.v-c .herb{position:absolute;pointer-events:none}
.v-c .toast{background:#24304f;color:#fffef8}.v-c .toast button{background:#fffef8;color:#24304f}
.v-c .sheet{background:#fffffb;color:#24304f}
.v-c .opt{border:1.5px solid #c8cfdd;background:#fff;color:#24304f}
.v-c .opt[aria-pressed="true"]{background:#24304f;border-color:#24304f;color:#fffef8}
.v-c .done{background:#24304f;color:#fffef8}
.v-c .nav{background:rgba(255,255,251,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid #d5dae3;color:#525d77}
.v-c .nav [aria-current]{color:#24304f;background:#e6eaee}


/* The mascot art is an opaque square tile, so it is treated as a die-cut sticker wherever it appears */
.sticker,.v-a .top img,.v-a .peek,.v-a .cheer,.v-b .lantern img,.v-c .doodle img{border-radius:12px;border:3px solid #fff;background:#f3e6b8;box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.v-a .peek,.v-a .cheer{filter:none}
.v-b .lantern img{border-color:#f6e7c8}
/* Reduced motion: swaps become a short cross-fade; no travel, bounce, steam or celebration */
@media (prefers-reduced-motion: reduce){
  .card,.card.settle,.v-b .sign,.toast,.sheet,.scrim{transition-duration:120ms!important;transition-timing-function:ease-out!important}
  .card.out,.card.in{transform:none!important}
  .v-a .peek{display:none}
  .v-b .slot.flipping .sign,.v-b .slot.flipped-in .sign{transform:none;opacity:.2}
  .steamy .steam path{animation:none}
}

/* Harness-only photo loader (chrome, not part of any design) */

/* ===== Picker: verbatim from the prototype skill's PICKER.md ===== */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>

<button class="done" data-act="close-adjust">Show my picks</button></section>`;
const toast=()=>`<div class="toast" role="status" aria-live="polite"><span></span><button data-act="undo">Undo</button></div>`;
const day=new Date().toLocaleDateString('en-US',{weekday:'long'});

/* String lights for Night Market */
function lights(){const pts=[];let s='';for(let i=0;i<=10;i++){const x=i*43,y=8+Math.sin(i/10*Math.PI)*16+(i%2)*3;pts.push([x,y])}
  s=`<path d="${cr(pts)}" stroke="#4a372a" stroke-width="1.5" fill="none"/>`+pts.slice(1,-1).map(([x,y],i)=>`<g class="bl"><circle class="halo" cx="${f(x)}" cy="${f(y+7)}" r="9"/><circle class="bulb" cx="${f(x)}" cy="${f(y+7)}" r="3.6"/></g>`).join('');
  return `<svg class="lights" viewBox="0 0 430 46" preserveAspectRatio="none" aria-hidden="true">${s}</svg>`}
const herb=(x,y,a,s)=>`<svg class="herb" style="left:${x}px;top:${y}px;width:${s}px;transform:rotate(${a}deg)" viewBox="0 0 40 20" aria-hidden="true"><path d="M2 10C12 0 28 0 38 10C28 20 12 20 2 10Z" fill="#4f8d3c"/><path d="M4 10H34" stroke="#cfe6a8" stroke-width="1.2"/></svg>`;

/* ================= The three directions ================= */
const V=[
 { key:'a',
   shell:cards=>`<header class="top"><img src="${LEEK}" alt=""><h1>What sounds good tonight?</h1><button class="add" data-act="add" aria-label="Save a craving">${plus}</button></header>
   <section class="panel" aria-label="Tonight's three picks"><div class="panel-head"><span>Three from your shelf</span><button class="chip" data-act="adjust" aria-haspopup="dialog">Adjust ${chev}</button></div><div class="grid">${cards}</div></section>
   <p class="note">Change your mind anytime. Skipped dishes go back on the shelf.</p>`,
   card:(d,i)=>`<div class="slot${i===0?' steamy':''}" data-slot="${i}"><img class="peek" src="${LEEK}" alt=""><article class="card" style="--t1:${d.t1}">${photo(d)}${i===0?`<span class="tag">${esc(d.from)}</span>`:''}
     <button class="skip" data-act="skip" aria-label="Not tonight: ${esc(d.title)}">${i===0?'Not tonight':xIcon}</button>
     <img class="cheer" src="${LEEK}" alt="">
     <div class="strip"><div class="t"><h3>${esc(d.title)}</h3><p>${mins(d.min)} · ${esc(d.cuisine)}</p>${i===0?`<span class="why">${esc(d.why)}</span>`:''}</div>
     <button class="choose" data-act="choose" aria-label="Choose ${esc(d.title)}"><span class="ok">${check}</span>${i===0?'<span class="lb-go">Choose</span><span class="lb-on">Tonight</span>':`<span class="lb-go">${check}</span>`}</button></div></article></div>`,
   swap:'nudge' },
 { key:'b',
   shell:cards=>`${lights()}<header class="top"><div class="lantern"><img src="${LEEK}" alt=""></div><div class="t"><h1>Tonight's stalls</h1><p class="sub">Three open this ${day}</p></div><button class="add" data-act="add" aria-label="Save a craving">${plus}</button></header>
   <div class="bar"><span>Swipe a stall away for another</span><button class="chip" data-act="adjust" aria-haspopup="dialog">Adjust ${chev}</button></div>
   <section class="rows" aria-label="Tonight's three picks">${cards}</section>`,
   card:(d,i)=>`<div class="slot" data-slot="${i}" style="--glow:${d.glow};--sign:${d.sign}"><article class="card">${photo(d)}<div class="info">
     <div class="sign"><span class="bulbs"></span><h3>${esc(d.title)}</h3></div><p class="meta">${mins(d.min)} · ${esc(d.cuisine)} · ${esc(d.why)}</p>
     <div class="acts"><button class="choose" data-act="choose" aria-label="Choose ${esc(d.title)}"><span class="ok">${check}</span>Eat this</button><button class="skip" data-act="skip" aria-label="Not tonight: ${esc(d.title)}">Not tonight</button><span class="lit">Tonight</span></div></div></article></div>`,
   swap:'flip' },
 { key:'c',
   shell:cards=>`<header class="top"><div><h1>What's for dinner?</h1><p class="sub">Three prints from your shelf</p></div><button class="add" data-act="add" aria-label="Save a craving">${plus}</button></header>
   <button class="chip" data-act="adjust" aria-haspopup="dialog">${chipLabel()} ${chev}</button>
   <section class="table" aria-label="Tonight's three picks">${herb(176,206,-24,34)}${herb(30,300,40,28)}${herb(364,404,10,30)}${cards}<div class="doodle"><img src="${LEEK}" alt=""><p>Toss one off the table and I'll find another.</p></div></section>`,
   card:(d,i)=>`<div class="slot" data-slot="${i}"><article class="card"><span class="tape"></span>${photo(d)}<span class="stamp">${esc(d.stamp[0])}<br>${esc(d.stamp[1])}</span>
     <div class="cap"><h3>${esc(d.title)}</h3>${i===0?`<p>${esc(d.why)}</p>`:''}</div>
     <div class="acts"><button class="choose" data-act="choose" aria-label="Choose ${esc(d.title)}">${i===0?'Cook this':'This one'}</button><button class="skip" data-act="skip" aria-label="Not tonight: ${esc(d.title)}">${i===0?'not tonight':'nah'}</button></div></article><span class="tonight">tonight!</span></div>`,
   swap:'toss' },
];

/* ================= Rendering + motion ================= */
let cur=null;
function render(v){S.time='any';S.vibe='any';rank();cur=v;return `<div class="v v-${v.key}" data-v="${v.key}">${v.shell(S.picks.map((id,i)=>v.card(byId(id),i)).join(''))}${toast()}${sheet()}${nav()}</div>`}
const root=()=>document.querySelector('#stage .v');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const anim=(el,k,o)=>(!el||RM.matches)?null:el.animate(k,o);

/* Entrance: content is visible from the first frame; it only settles into place */
function intro(){const r=root();if(!r||RM.matches)return;const k=cur.key;
  r.querySelectorAll('.slot').forEach((s,i)=>{
    const from=k==='c'?'translateY(-14px) rotate(-3deg)':'translateY(14px)';
    s.animate([{transform:from,opacity:.35},{transform:'none',opacity:1}],{duration:k==='c'?520:440,delay:70*i,easing:k==='c'?'cubic-bezier(.34,1.3,.64,1)':'cubic-bezier(.23,1,.32,1)',fill:'backwards'})});
  if(k==='b')r.querySelectorAll('.lights .bl').forEach((b,i)=>b.animate([{opacity:.25},{opacity:1}],{duration:260,delay:40*i,fill:'backwards',easing:'ease-out'}));
}
new MutationObserver(()=>{if(root())intro()}).observe(document.getElementById('stage'),{childList:true});

async function swapSlot(i,id,reason){
  const v=cur,slot=root().querySelector(`.slot[data-slot="${i}"]`);if(!slot)return;
  const tmp=document.createElement('div');tmp.innerHTML=v.card(byId(id),i);const fresh=tmp.firstElementChild;
  const replaceCard=()=>{const old=slot.querySelector('.card');const nc=fresh.querySelector('.card');old.replaceWith(nc);if(v.key==='b'){slot.style.setProperty('--glow',byId(id).glow);slot.style.setProperty('--sign',byId(id).sign)}return nc};
  if(RM.matches){const c=slot.querySelector('.card');c.style.opacity='0';await wait(120);const nc=replaceCard();nc.style.opacity='0';await frame();nc.style.opacity='';return}
  const card=slot.querySelector('.card');
  if(v.swap==='nudge'){
    card.classList.add('out');slot.classList.add('nudging');await wait(170);
    const nc=replaceCard();nc.classList.add('in');await frame();nc.classList.remove('in');
    await wait(170);slot.classList.remove('nudging');
  }else if(v.swap==='flip'&&reason!=='swipe'){
    slot.classList.add('flipping');await wait(150);
    replaceCard();slot.classList.remove('flipping');slot.classList.add('flipped-in');await frame();slot.classList.remove('flipped-in');
  }else if(v.swap==='flip'){
    card.classList.add('out');await wait(200);const nc=replaceCard();nc.classList.add('in');await frame();nc.classList.remove('in');
  }else{
    card.classList.add('out');await wait(200);
    const nc=replaceCard();nc.classList.add('in');await frame();nc.classList.add('settle');nc.classList.remove('in');await wait(400);nc.classList.remove('settle');
  }
}
let tTimer;
function say(text,undo){const t=root().querySelector('.toast');t.querySelector('span').textContent=text;t.querySelector('button').hidden=!undo;t.classList.add('is-on');clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('is-on'),4200)}
function paintChoice(){const r=root();r.classList.toggle('has-choice',!!S.chosen);r.querySelectorAll('.slot').forEach((s,i)=>{const on=S.picks[i]===S.chosen;s.classList.toggle('is-chosen',on);if(cur.key!=='a'||i!==0)s.classList.toggle('steamy',on);const b=s.querySelector('.choose');if(b)b.setAttribute('aria-pressed',on)})}

/* The one authored moment: choosing tonight's dish */
function celebrate(slot){
  if(RM.matches)return;try{navigator.vibrate?.(12)}catch{}
  const k=cur.key,ease='cubic-bezier(.23,1,.32,1)';
  if(k==='a'){
    anim(slot.querySelector('.cheer'),[{transform:'translateY(150px) rotate(0)',easing:'cubic-bezier(.34,1.35,.64,1)'},{transform:'translateY(-30px) rotate(-10deg)',offset:.26,easing:'ease-in-out'},{transform:'translateY(-26px) rotate(9deg)',offset:.42,easing:'ease-in-out'},{transform:'translateY(-30px) rotate(-4deg)',offset:.56,easing:'ease-in-out'},{transform:'translateY(-28px) rotate(0)',offset:.78,easing:'cubic-bezier(.55,0,.75,.3)'},{transform:'translateY(150px) rotate(0)'}],{duration:1600,easing:'linear'});
    const b=slot.querySelector('.choose').getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;
    for(let n=0;n<11;n++){const c=document.createElement('span');c.className='confetti'+(n%3?'':' slice');c.style.left=x+'px';c.style.top=y+'px';document.body.appendChild(c);
      const a=-Math.PI/2+(n/10-.5)*2.6+(Math.random()-.5)*.3,d=46+Math.random()*44;
      c.animate([{transform:'translate(0,0) scale(.4)',opacity:1,easing:ease},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(1)`,opacity:1,offset:.45,easing:'cubic-bezier(.45,0,.75,.4)'},{transform:`translate(${Math.cos(a)*d*1.12}px,${Math.sin(a)*d*1.12+30}px) scale(.75) rotate(${Math.random()*140}deg)`,opacity:0}],{duration:1000,easing:'linear'}).onfinish=()=>c.remove()}
    anim(slot.querySelector('.choose'),[{transform:'scale(.92)'},{transform:'scale(1.06)',offset:.5},{transform:'scale(1)'}],{duration:380,easing:ease});
  }else if(k==='b'){
    anim(slot.querySelector('.bulbs'),[{backgroundPosition:'0 0'},{backgroundPosition:'8px 0'}],{duration:240,iterations:5,easing:'steps(2)'});
    anim(slot.querySelector('.sign'),[{transform:'scale(1)'},{transform:'scale(1.05)',offset:.35},{transform:'scale(1)'}],{duration:420,easing:ease});
    root().querySelectorAll('.lights .bl').forEach((bl,i)=>anim(bl,[{opacity:1},{opacity:.25},{opacity:1}],{duration:360,delay:i*55,easing:'ease-out'}));
    anim(root().querySelector('.lantern img'),[{transform:'rotate(0)'},{transform:'rotate(-9deg)',offset:.3},{transform:'rotate(6deg)',offset:.6},{transform:'rotate(0)'}],{duration:900,easing:ease});
  }else{
    anim(slot.querySelector('.tape'),[{transform:'translateX(-50%) rotate(-12deg) scale(1.35)',opacity:0},{transform:'translateX(-50%) rotate(-4deg) scale(1)',opacity:1}],{duration:260,easing:ease});
    anim(slot.querySelector('.card'),[{transform:'rotate(var(--r)) translateY(0)'},{transform:'rotate(var(--r)) translateY(3px) scale(.985)',offset:.4},{transform:'rotate(var(--r))'}],{duration:300,easing:ease});
    anim(slot.querySelector('.tonight'),[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{duration:520,delay:160,easing:'cubic-bezier(.65,0,.35,1)',fill:'backwards'});
    anim(root().querySelector('.doodle img'),[{transform:'rotate(-6deg) translateY(0)'},{transform:'rotate(-14deg) translateY(-16px)',offset:.4},{transform:'rotate(2deg) translateY(-4px)',offset:.7},{transform:'rotate(-6deg) translateY(0)'}],{duration:800,easing:ease});
  }
}

let busy=false;
async function skip(i,reason){
  if(busy)return;busy=true;
  const id=S.picks[i],next=S.queue.shift();S.queue.push(id);S.picks[i]=next;
  if(S.chosen===id)S.chosen=null;
  S.last={type:'skip',i,id,next};paintChoice();
  await swapSlot(i,next,reason);paintChoice();say(`${byId(id).title} is back on the shelf`,true);busy=false;
}
function choose(i){
  const id=S.picks[i],prev=S.chosen;S.chosen=prev===id?null:id;S.last={type:'choose',prev};paintChoice();
  if(S.chosen){celebrate(root().querySelector(`.slot[data-slot="${i}"]`));say(`${byId(id).title} it is. Enjoy tonight.`,true)}else say('Back to deciding',false);
}
async function undo(){
  const L=S.last;if(!L||busy)return;S.last=null;root().querySelector('.toast').classList.remove('is-on');
  if(L.type==='choose'){S.chosen=L.prev;paintChoice();return}
  busy=true;S.queue=S.queue.filter(x=>x!==L.id);S.queue.unshift(L.next);S.picks[L.i]=L.id;await swapSlot(L.i,L.id,'undo');paintChoice();busy=false;
}
async function rerank(){
  busy=true;const before=[...S.picks];const t=S.time,vb=S.vibe;rank();S.time=t;S.vibe=vb;
  const chip=root().querySelector('.v-c .chip');if(chip)chip.innerHTML=`${chipLabel()} ${chev}`;
  await Promise.all(S.picks.map((id,i)=>id===before[i]?null:wait(i*60).then(()=>swapSlot(i,id,'adjust'))));paintChoice();busy=false;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||!root()||!root().contains(el))return;
  const slot=el.closest('.slot'),i=slot?Number(slot.dataset.slot):-1,act=el.dataset.act;
  if(act==='skip')skip(i,'button');
  else if(act==='choose')choose(i);
  else if(act==='undo')undo();
  else if(act==='adjust'){root().classList.add('adjusting');root().querySelector('.sheet .opt[aria-pressed="true"]')?.focus({preventScroll:true})}
  else if(act==='close-adjust')root().classList.remove('adjusting');
  else if(act==='opt'){const k=el.dataset.k;S[k]=el.dataset.val;root().querySelectorAll(`.opt[data-k="${k}"]`).forEach(b=>b.setAttribute('aria-pressed',b===el));rerank()}
  else if(act==='add')say('Capture lives in the real app. This prototype is just Today.',false);
  else if(act==='nav')say('Prototype covers Today only',false);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&root()?.classList.contains('adjusting'))root().classList.remove('adjusting')});

/* Night Market: swipe a stall left to skip (distance or velocity); rubber-band to the right */
let drag=null;
document.addEventListener('pointerdown',e=>{const card=e.target.closest('.v-b .card');if(!card||e.target.closest('button')||busy)return;drag={card,x:e.clientX,y:e.clientY,t:performance.now(),dx:0,id:e.pointerId,on:false}});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){if(Math.abs(dx)<8||Math.abs(dx)<Math.abs(dy)){if(Math.abs(dy)>10)drag=null;return}drag.on=true;drag.card.classList.add('dragging');drag.card.setPointerCapture?.(e.pointerId)}
  drag.dx=dx>0?dx*0.25:dx;drag.card.style.transform=`translateX(${drag.dx}px) rotate(${drag.dx/60}deg)`;
});
function endDrag(e){if(!drag||(e&&e.pointerId!==drag.id))return;const d=drag;drag=null;if(!d.on)return;
  const v=Math.abs(d.dx)/(performance.now()-d.t);d.card.classList.remove('dragging');d.card.style.transform='';
  if(d.dx<-90||(d.dx<-30&&v>0.11))skip(Number(d.card.closest('.slot').dataset.slot),'swipe')}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

/* Harness photo loader */
const pInput=document.getElementById('proto-photo-input');
document.getElementById('proto-photos').addEventListener('click',()=>pInput.click());
pInput.addEventListener('change',async()=>{
  const files=[...pInput.files].filter(f=>f.type.startsWith('image/')).slice(0,8);if(!files.length)return;
  const out=[];for(const fl of files){const url=URL.createObjectURL(fl);try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});const s=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);out.push(c.toDataURL('image/jpeg',.82))}catch{}finally{URL.revokeObjectURL(url)}}
  PHOTOS=out;try{localStorage.setItem('nouri-proto-photos',JSON.stringify(out))}catch{}
  pInput.value='';mount(current);
});

/* ===== Picker wiring: verbatim from PICKER.md ===== */
const variants=V.map(v=>()=>render(v));
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
