<title>Nouri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/*__CSS__*/
</style>
<div class="wrap">
  <section class="view on" id="v-today" aria-label="Today"></section>
  <section class="view" id="v-saved" aria-label="Saved"></section>
  <section class="view" id="v-week" aria-label="This week"></section>
  <section class="view" id="v-history" aria-label="History"></section>
</div>
<nav class="nav" aria-label="Main"><div class="in">
  <button data-go="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5"/></svg>Today</button>
  <button data-go="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>Saved</button>
  <button class="plus" data-act="capture" aria-label="Save a craving"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-go="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1.5 12h-13L4 9ZM9 9V6a3 3 0 0 1 6 0v3"/></svg>Week</button>
  <button data-go="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7c-3-2-6-2-10-2v15c4 0 7 0 10 2 3-2 6-2 10-2V5c-4 0-7 0-10 2Zm0 0v15"/></svg>History</button>
</div></nav>
<section class="cook" id="cook" role="dialog" aria-modal="true" aria-label="Cooking" hidden><div class="in"></div></section>
<div class="cookbar" id="cookbar" hidden><form class="in" id="cook-form"><button type="button" class="cam" data-act="cam" aria-label="Add a photo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg></button><label class="sr" for="cook-note">Quick note</label><input id="cook-note" placeholder="Quick note, e.g. added more stock" autocomplete="off" enterkeyhint="send"><button class="ibtn" aria-label="Add note"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form></div>
<div class="toast" id="toast" role="status" aria-live="polite"><img class="lk" src="__LEEK__" alt="" hidden><span></span><button type="button" id="toast-undo">Undo</button></div>
<div id="sheets"></div>
<input type="file" id="file-photo" accept="image/*" hidden>
<input type="file" id="file-import" accept="application/json,.json" hidden>

/*__JS__*/
</script>
