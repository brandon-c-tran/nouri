<title>Nouri</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Nouri. Layout: one-handed phone column; the task (tonight's 3 picks, the active cook, the
   grocery list) is always the visual center. Light: rice paper and scallion greens.
   Dark (follows the phone): soy and lantern warmth, so food glows at night. */
:root{
  --bg:#f1ede3;--surface:#fbf9f3;--sunk:#e8e2d4;--line:#d9d1c0;
  --fg:#17241a;--mut:#4d594c;--dim:#5d6759;
  --green:#2b673a;--on-green:#ffffff;--green-soft:#dcebcf;--green-soft-ink:#1d4626;
  --leaf:#9fd06a;--leaf-ink:#173015;
  --chili:#ad3f28;--chili-soft:#f4ddd4;
  --strip:#fbf9f3;--strip-ink:#17241a;--strip-mut:#55604f;
  --scrim:rgba(20,24,16,.42);--shadow:0 14px 34px -18px rgba(44,38,20,.45);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --display:"Bricolage Grotesque",ui-rounded,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);--drawer:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15110d;--surface:#211913;--sunk:#1b1511;--line:#3a2d23;
  --fg:#f5ebda;--mut:#cdb99d;--dim:#ab967c;
  --green:#a6dc79;--on-green:#13230d;--green-soft:#26361d;--green-soft-ink:#cfeeb3;
  --leaf:#a6dc79;--leaf-ink:#13230d;--chili:#ef7a5f;--chili-soft:#3a1c14;
  --strip:#f7efe1;--strip-ink:#1b140f;--strip-mut:#5d5045;
  --scrim:rgba(0,0,0,.6);--shadow:0 16px 36px -16px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110d;--surface:#211913;--sunk:#1b1511;--line:#3a2d23;
  --fg:#f5ebda;--mut:#cdb99d;--dim:#ab967c;
  --green:#a6dc79;--on-green:#13230d;--green-soft:#26361d;--green-soft-ink:#cfeeb3;
  --leaf:#a6dc79;--leaf-ink:#13230d;--chili:#ef7a5f;--chili-soft:#3a1c14;
  --strip:#f7efe1;--strip-ink:#1b140f;--strip-mut:#5d5045;
  --scrim:rgba(0,0,0,.6);--shadow:0 16px 36px -16px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.42 var(--ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
::selection{background:var(--leaf);color:var(--leaf-ink)}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px}
img,svg{display:block}
a{color:var(--green);text-underline-offset:3px}
h1,h2,h3{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:520px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.view{display:none}.view.on{display:block}

/* ---------- Headers, chips, buttons ---------- */
.hd{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
.hd h1{flex:1;min-width:0;margin:0;font:800 29px/1.04 var(--display);letter-spacing:-.025em;font-variation-settings:"opsz" 48}
.hd .count{font:600 15px var(--ui);color:var(--dim);font-variant-numeric:tabular-nums}
.leek{width:40px;height:40px;flex:0 0 auto;border-radius:12px 12px 12px 4px;border:2.5px solid #fff;background:#f3e6b8;object-fit:contain;box-shadow:0 6px 12px -6px rgba(40,30,10,.5);transform:rotate(-4deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:15px;font-weight:650;font-size:16px;white-space:nowrap;transition:transform 120ms var(--ease),background-color 180ms,color 180ms}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.pri{background:var(--green);color:var(--on-green)}
.btn.soft{background:var(--green-soft);color:var(--green-soft-ink)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.btn.warn{background:var(--chili-soft);color:var(--chili)}
.btn.block{width:100%;min-height:54px;border-radius:17px;font-size:17px}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px;border-radius:13px}
.ibtn{width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--fg);transition:transform 120ms var(--ease)}
.ibtn:active{transform:scale(.93)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px)) 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:15px;transition:transform 120ms var(--ease),background-color 160ms,color 160ms}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px}
.sec h2{margin:0;font:750 20px/1.15 var(--display);letter-spacing:-.015em}
.sec .link{font-weight:600;font-size:15px;color:var(--green);min-height:44px;display:inline-flex;align-items:center}
.muted{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;background:var(--sunk);color:var(--mut);white-space:nowrap}
.tag.green{background:var(--green-soft);color:var(--green-soft-ink)}
.guess{font-size:12px;color:var(--dim);font-weight:600}

/* ---------- Food covers ---------- */
.cover{position:relative;overflow:hidden;background:var(--t,var(--sunk))}
.cover>img,.cover>svg{position:absolute;inset:0;width:100%;height:100%}
.cover>img{object-fit:cover}
/* No-photo saves: a soft tinted card that carries the spark (your note and its source), never fake food */
.tilew{background:var(--tb)}
.hue0{--tb:#dce8cf;--ti:#1f4626}.hue1{--tb:#ecdfcb;--ti:#57381d}.hue2{--tb:#f2dace;--ti:#7a2d1b}.hue3{--tb:#d6e4dc;--ti:#20463a}.hue4{--tb:#e9e3c3;--ti:#4b4713}.hue5{--tb:#ecd8de;--ti:#5d2e42}.hue6{--tb:#d6e1ea;--ti:#22425a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hue0{--tb:#223320;--ti:#cfe8bd}:root:not([data-theme="light"]) .hue1{--tb:#33261a;--ti:#ecd4b4}:root:not([data-theme="light"]) .hue2{--tb:#3a2119;--ti:#f3c3b1}:root:not([data-theme="light"]) .hue3{--tb:#1f302a;--ti:#c3e2d4}:root:not([data-theme="light"]) .hue4{--tb:#302e17;--ti:#e7df9f}:root:not([data-theme="light"]) .hue5{--tb:#33202a;--ti:#efc6d6}:root:not([data-theme="light"]) .hue6{--tb:#1d2a36;--ti:#c3d8ea}}
:root[data-theme="dark"] .hue0{--tb:#223320;--ti:#cfe8bd}:root[data-theme="dark"] .hue1{--tb:#33261a;--ti:#ecd4b4}:root[data-theme="dark"] .hue2{--tb:#3a2119;--ti:#f3c3b1}:root[data-theme="dark"] .hue3{--tb:#1f302a;--ti:#c3e2d4}:root[data-theme="dark"] .hue4{--tb:#302e17;--ti:#e7df9f}:root[data-theme="dark"] .hue5{--tb:#33202a;--ti:#efc6d6}:root[data-theme="dark"] .hue6{--tb:#1d2a36;--ti:#c3d8ea}
.tile{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:14px 14px 16px;color:var(--ti)}
.tile .src{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .qt{font:700 22px/1.16 var(--display);letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.slot:not(.hero) .tile .qt,.card .tile .qt{font-size:18px}
.tile .nm{font:800 20px/1.1 var(--display);letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .wm{margin:auto;opacity:.32}
.tile.mini{align-items:center;justify-content:center;padding:0}
.sample-mark{position:absolute;z-index:2;left:10px;bottom:10px;padding:4px 9px;border-radius:999px;background:rgba(15,12,8,.6);color:#fff;font-size:12px;font-weight:650;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.steam path{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.steamy .steam path{animation:steam 3.8s ease-in-out infinite}
.steamy .steam path:nth-child(2){animation-delay:1.25s}.steamy .steam path:nth-child(3){animation-delay:2.5s}
@keyframes steam{0%{opacity:0;transform:translateY(8px) scaleY(.8)}35%{opacity:.5}100%{opacity:0;transform:translateY(-18px) scaleY(1.15)}}

/* ---------- Today ---------- */
.banner{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;margin:0 0 14px;border-radius:20px 20px 20px 8px;background:var(--green);color:var(--on-green);box-shadow:var(--shadow);width:100%;text-align:left}
.banner .cover{width:52px;height:52px;border-radius:14px;flex:0 0 auto}
.banner b{display:block;font:700 16px/1.2 var(--display)}
.banner span{font-size:14px;opacity:.85}
.banner .t{flex:1;min-width:0}
.picks{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:268px 214px;gap:10px;margin-top:12px}
.slot{position:relative;overflow:hidden;border-radius:22px;touch-action:pan-y;box-shadow:var(--shadow)}
.slot.hero{grid-column:1/3;border-radius:30px 30px 22px 30px}
.pcard{position:absolute;inset:0;background:var(--t,var(--sunk));transition:transform 260ms var(--ease),opacity 220ms var(--ease)}
.pcard>.open{position:absolute;inset:0;z-index:1}
.pcard .cover{position:absolute;inset:0 0 44px 0}
.slot:not(.hero) .pcard .cover{inset:0 0 58px 0}
.strip{position:absolute;z-index:2;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:10px;padding:11px 8px 11px 14px;border-radius:18px;background:var(--strip);color:var(--strip-ink);box-shadow:0 10px 20px -14px rgba(0,0,0,.7)}
.strip .t{flex:1;min-width:0}
.strip h3{margin:0;font:800 21px/1.08 var(--display);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip p{margin:3px 0 0;font-size:14px;line-height:1.3;color:var(--strip-mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot:not(.hero) .strip{left:6px;right:6px;bottom:6px;padding:9px 6px 9px 11px;border-radius:15px;gap:6px;align-items:flex-end}
.slot:not(.hero) .strip h3{font-size:16px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot:not(.hero) .strip p{font-size:13px;-webkit-line-clamp:2}
.strip .go{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:13px;background:var(--green);color:var(--on-green);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;transition:transform 120ms var(--ease),background-color 200ms,color 200ms}
:root:not([data-theme="light"]) .strip .go{background:#2b673a;color:#fff}
.strip .go:active{transform:scale(.95)}
.slot:not(.hero) .strip .go{width:44px;padding:0;justify-content:center}
.meta-chip{position:absolute;z-index:2;top:10px;left:10px;max-width:60%;padding:5px 10px;border-radius:999px;background:rgba(251,249,243,.94);color:#17241a;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nope{position:absolute;z-index:2;top:8px;right:8px;min-height:44px;padding:0 14px;border-radius:999px;background:rgba(14,12,8,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:transform 120ms var(--ease)}
.slot:not(.hero) .nope{width:44px;padding:0;justify-content:center}
.nope:active{transform:scale(.94)}
.peek,.cheer{position:absolute;pointer-events:none;border-radius:10px;border:2.5px solid #fff;background:#f3e6b8;box-shadow:0 6px 12px -6px rgba(0,0,0,.6)}
.peek{z-index:3;right:-6px;bottom:28%;width:54px;transform:translateX(120%) rotate(-6deg);transition:transform 240ms var(--ease)}
.slot.nudging .peek{transform:translateX(14%) rotate(-16deg)}
.cheer{z-index:1;right:24px;bottom:56px;width:54px;transform:translateY(170px)}
.slot:not(.hero) .cheer{width:40px;right:10px;bottom:60px}
.pcard.out{transform:translateX(-24px) scale(.98);opacity:0;transition-duration:180ms}
.pcard.in{transform:translateX(30px);opacity:0;transition:none}
.pcard.drag{transition:none}
.slot.chosen{box-shadow:0 0 0 3px var(--green),var(--shadow)}
.picks.has-choice .slot:not(.chosen) .pcard{opacity:.5}
.slot.chosen .strip .go{background:var(--leaf);color:var(--leaf-ink)}
.tonight{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}
.add-slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;width:100%;border-radius:22px;border:1.5px dashed var(--line);color:var(--mut);font-weight:600;font-size:15px;background:var(--surface);text-align:center;padding:10px}
.wk{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:left;min-height:64px}
.wk .stack{display:flex;flex:0 0 auto}
.wk .stack .cover{width:40px;height:40px;border-radius:12px;border:2px solid var(--surface)}
.wk .stack .cover+.cover{margin-left:-12px}
.wk .t{flex:1;min-width:0}
.wk b{display:block;font-weight:650}
.wk span{font-size:14px;color:var(--mut)}
.cap-inline{padding:14px;border-radius:24px 24px 24px 8px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.cap-inline textarea{width:100%;min-height:76px;border:0;background:none;resize:none;font-size:18px;line-height:1.35;padding:2px}
.cap-inline textarea:focus{outline:none}
.cap-inline .row{display:flex;gap:8px;align-items:center;margin-top:8px}

/* ---------- Lists ---------- */
.search{width:100%;min-height:48px;padding:0 16px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:16px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;display:block;width:100%;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform 120ms var(--ease)}
.card:active{transform:scale(.98)}
.card .cover{aspect-ratio:4/5;width:100%}
.card .b{padding:9px 11px 12px}
.card h3{margin:0;font:750 16px/1.15 var(--display);letter-spacing:-.01em}
.card p{margin:4px 0 0;font-size:13px;color:var(--mut);line-height:1.3}
.card .q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--fg)}
.card .badge{position:absolute;z-index:2;top:8px;left:8px}
.rows>*+*{margin-top:8px}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:18px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.row .cover{width:68px;height:68px;border-radius:13px;flex:0 0 auto}
.row .t{flex:1;min-width:0}
.row h3{margin:0;font:700 16px/1.2 var(--display)}

.row .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:68px}
.day{margin:22px 0 8px;font-size:14px;font-weight:650;color:var(--dim)}
.empty{padding:26px 18px;border-radius:24px;background:var(--surface);border:1px solid var(--line);text-align:center}
.empty h2{margin:12px 0 6px;font:750 21px/1.15 var(--display)}
.empty p{margin:0 0 16px;color:var(--mut)}
.empty .leek{margin:0 auto;width:60px;height:60px}
.stats{margin:-2px 0 4px;font-size:14px;color:var(--mut)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}

/* ---------- Groceries ---------- */
.glist{border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:2px 4px 2px 14px}
.gi{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.gi:last-child{border-bottom:0}
.gi .ck{width:28px;height:28px;flex:0 0 auto;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-green);transition:background-color 160ms,border-color 160ms}
.gi .ck.on{background:var(--green);border-color:var(--green)}
.gi .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:52px;text-align:left}
.gi .n{display:block}
.gi .from{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi.done .n{color:var(--dim);text-decoration:line-through}
.gi .have{min-height:44px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--mut)}
.warn-row{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--chili-soft);color:var(--fg);margin-bottom:8px}
.warn-row p{margin:0 0 8px;font-size:15px}
.addline{display:flex;gap:8px;margin-top:10px}
.addline input{flex:1;min-width:0;min-height:48px;padding:0 14px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:16px}
details.more>summary{list-style:none;min-height:44px;display:flex;align-items:center;gap:6px;font-weight:600;color:var(--mut);cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}

/* ---------- Nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:center}
.nav button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--dim);transition:transform 120ms var(--ease)}
.nav button:active{transform:scale(.93)}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{color:var(--green)}
.nav .plus{width:56px;height:56px;margin:0 auto;border-radius:20px 20px 20px 8px;background:var(--green);color:var(--on-green);box-shadow:var(--shadow)}
.nav svg{width:23px;height:23px}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);opacity:0;transition:opacity 240ms var(--ease)}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:93dvh;overflow:auto;overscroll-behavior:contain;margin:0 auto;max-width:560px;padding:8px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));border-radius:28px 28px 0 0;background:var(--bg);transform:translateY(100%);transition:transform 320ms var(--drawer);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;margin:4px auto 12px;background:var(--line)}
.sheet h2{margin:0 0 14px;font:800 24px/1.1 var(--display);letter-spacing:-.02em;padding-right:52px}
.sheet .x{position:absolute;top:12px;right:max(14px,env(safe-area-inset-right,0px))}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:6px}
.field,.ta{width:100%;min-height:50px;padding:0 15px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.ta{min-height:96px;padding:13px 15px;resize:vertical;line-height:1.4}
.ta.big{font-size:18px;min-height:110px}
.seg{display:flex;gap:6px;flex-wrap:wrap}

.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}

.box{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}

<script>
/* Nouri core: data model, migration, link parsing, recommendations and grocery derivation.
   Pure functions only (no DOM, no storage), so they can be unit-tested with `node --test`. */
(function (root) {
  'use strict';
  const DAY = 864e5;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const hash = (s) => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
  const iso = (t) => new Date(t).toISOString();

  /* ---------- Links ---------- */
  const HOSTS = [
    ['tiktok', /(^|\.)tiktok\.com$/], ['instagram', /(^|\.)instagram\.com$/], ['youtube', /(^|\.)(youtube\.com|youtu\.be)$/],
    ['reddit', /(^|\.)reddit\.com$/], ['pinterest', /(^|\.)pinterest\./], ['maps', /(^|\.)(maps\.app\.goo\.gl|goo\.gl|google\.[a-z.]+)$/],
  ];
  const SOURCE_LABEL = { tiktok: 'TikTok', instagram: 'Instagram', youtube: 'YouTube', reddit: 'Reddit', pinterest: 'Pinterest', maps: 'Maps', web: 'Link', photo: 'Photo', text: 'Note', restaurant: 'Ate out', sample: 'Sample' };
  const URL_RE = /https?:\/\/[^\s<>"']+/i;
  function nameFromPath(u, type) {
    if (type !== 'web') return '';
    const segs = u.pathname.split('/').filter(Boolean).reverse();
    for (const s of segs) {
      let t; try { t = decodeURIComponent(s); } catch { t = s; }
      t = t.replace(/\.(html?|php|aspx?)$/i, '').replace(/[-_+]+/g, ' ').replace(/\b\d+\b/g, ' ').replace(/\s+/g, ' ').trim();
      if (t.length < 5 || !/[a-z]{3}/i.test(t) || /^(recipe|recipes|food|cooking|amp|index|post|posts|p|watch|blog)$/i.test(t)) continue;
      t = t.replace(/\brecipes?\b/gi, '').replace(/\s+/g, ' ').trim();
      if (t.length < 4) continue;
      return t.charAt(0).toUpperCase() + t.slice(1);
    }
    return '';
  }
  /** Split a capture string into a link (if any) and the remaining words. */
  function parseCapture(text) {
    const raw = String(text || '').trim();
    const m = raw.match(URL_RE);
    let link = null;
    if (m) {
      try {
        const u = new URL(m[0].replace(/[),.;]+$/, ''));
        const host = u.hostname.replace(/^www\./, '').toLowerCase();
        const type = (HOSTS.find(([, r]) => r.test(host)) || ['web'])[0];
        link = { url: u.href, host, type, nameGuess: nameFromPath(u, type) };
      } catch { link = null; }
    }
    const words = (m ? raw.replace(m[0], ' ') : raw).replace(/\s+/g, ' ').trim();
    return { link, words };
  }

  /* ---------- Model + migration (v1 docs from the first v0 stay readable) ---------- */
  const WHERE = ['home', 'restaurant', 'work', 'other'];
  const FEEL = [{ n: 5, label: 'Loved it' }, { n: 4, label: 'Good' }, { n: 3, label: 'Fine' }, { n: 1, label: 'Not for me' }];
  const feelLabel = (n) => (n >= 5 ? 'Loved it' : n === 4 ? 'Good' : n === 3 || n === 2 ? 'Fine' : n === 1 ? 'Not for me' : '');

  function normalizeDish(raw) {
    if (!raw) return null;
    const d = { ...raw };
    if (d.v !== 2) {
      // v1 idea → v2 dish. Keeps every field the user entered.
      d.name = d.name || d.title || '';
      d.sample = d.source === 'starter';
      const at = d.createdAt || iso(Date.now());
      d.sources = [];
      if (d.url) { const p = parseCapture(d.url).link; d.sources.push({ id: 'src-' + d.id, type: p ? p.type : 'web', url: d.url, host: p ? p.host : '', note: d.why || '', at }); }
      else if (!d.sample) d.sources.push({ id: 'src-' + d.id, type: d.source === 'restaurant' ? 'restaurant' : 'text', note: d.why || '', at });
      d.ingredientsFrom = d.sample ? 'sample' : (d.ingredients && d.ingredients.length ? 'user' : '');
      d.status = 'want';
      delete d.title; delete d.url; delete d.why; delete d.source; delete d.want; delete d.tags; delete d.emoji;
    }
    d.v = 2;
    d.name = d.name || '';
    d.sources = Array.isArray(d.sources) ? d.sources : [];
    d.ingredients = Array.isArray(d.ingredients) ? d.ingredients.map(String).filter(Boolean) : [];
    d.ingredientsFrom = d.ingredientsFrom || (d.ingredients.length ? 'user' : '');
    d.guessed = d.guessed || {};
    d.status = d.status || 'want';
    d.createdAt = d.createdAt || iso(Date.now());
    d.minutes = Number(d.minutes) || null;
    d.cuisine = d.cuisine || '';
    d.vibe = d.vibe || '';
    d.sample = !!d.sample;
    return d;
  }
  function normalizeMeal(raw) {
    if (!raw) return null;
    const m = { ...raw };

function blob(R,x,y,r,k=9,j=.22){const p=[];for(let i=0;i<k;i++){const a=i/k*Math.PI*2,d=r*(1-j+R()*j*2);p.push([x+Math.cos(a)*d,y+Math.sin(a)*d])}return crc(p)}
const many=(n,fn)=>Array.from({length:n},(_,i)=>fn(i)).join('');

const P={
  table(u,c1,c2,kind){let t=`<rect width="320" height="240" fill="${c1}"/>`;
    if(kind==='wood')t+=many(9,i=>`<path d="M-10 ${12+i*28} C80 ${4+i*28} 200 ${22+i*28} 330 ${10+i*28}" stroke="${c2}" stroke-width="${2+i%3}" fill="none" opacity=".45"/>`);
    if(kind==='linen')t+=`<pattern id="ln${u}" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 5H10M5 0V10" stroke="${c2}" stroke-width="1" opacity=".35"/></pattern><rect width="320" height="240" fill="url(#ln${u})"/>`;
    if(kind==='tile')t+=many(7,i=>`<path d="M${i*54-10} 0V240" stroke="${c2}" stroke-width="2.5"/>`)+many(5,i=>`<path d="M0 ${i*54+8}H320" stroke="${c2}" stroke-width="2.5"/>`);
    return t+`<rect width="320" height="240" filter="url(#gr${u})" opacity=".55"/>`},
  shadow:(u,cx,cy,r)=>`<ellipse cx="${cx+7}" cy="${cy+11}" rx="${r+3}" ry="${r}" fill="#000" opacity=".32" filter="url(#bl${u})"/>`,
  bowl(u,cx,cy,r,body,dark,well,iw){return P.shadow(u,cx,cy,r)+`<radialGradient id="bw${u}" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="${body}"/><stop offset="1" stop-color="${dark}"/></radialGradient><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#bw${u})"/><path d="M${cx-r*.78} ${cy-r*.55} A${r*.95} ${r*.95} 0 0 1 ${cx+r*.1} ${cy-r*.95}" stroke="#fff" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/><clipPath id="cl${u}"><circle cx="${cx}" cy="${cy}" r="${iw}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${iw}" fill="${well}"/>`},
  well:(u,cx,cy,iw)=>`<radialGradient id="ws${u}"><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient><circle cx="${cx}" cy="${cy}" r="${iw}" fill="url(#ws${u})"/>`,
  plate(u,cx,cy,r,rim){return P.shadow(u,cx,cy,r)+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#f8f6f0"/><circle cx="${cx}" cy="${cy}" r="${r*.8}" fill="#f3f0e8"/>${rim?`<circle cx="${cx}" cy="${cy}" r="${r-5}" fill="none" stroke="${rim}" stroke-width="2.5"/>`:''}<path d="M${cx-r*.8} ${cy-r*.5} A${r*.95} ${r*.95} 0 0 1 ${cx} ${cy-r*.96}" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>`},
  saucer:(u,x,y,r,body,sauce)=>`<ellipse cx="${x+3}" cy="${y+5}" rx="${r}" ry="${r*.95}" fill="#000" opacity=".28" filter="url(#bl${u})"/><circle cx="${x}" cy="${y}" r="${r}" fill="${body}"/><circle cx="${x}" cy="${y}" r="${r*.72}" fill="${sauce}"/><ellipse cx="${x-r*.25}" cy="${y-r*.28}" rx="${r*.22}" ry="${r*.12}" fill="#fff" opacity=".4"/>`,
  sticks:(u,x,y,a,c)=>`<g transform="translate(${x} ${y}) rotate(${a})"><path d="M0 0L200 -4L200 2L0 7Z" fill="#000" opacity=".25" transform="translate(4 6)" filter="url(#bl${u})"/><path d="M0 0L200 -3L200 2L0 6Z" fill="${c}"/><path d="M4 14L204 9L204 14L4 20Z" fill="${c}"/><path d="M0 1L120 -1" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/></g>`,
  spoon:(u,x,y,a,c)=>`<g transform="translate(${x} ${y}) rotate(${a})"><ellipse cx="4" cy="6" rx="26" ry="18" fill="#000" opacity=".25" filter="url(#bl${u})"/><path d="M-24 0C-24 -16 22 -18 26 -2C30 12 -24 16 -24 0Z" fill="${c}"/><path d="M-16 0C-16 -9 16 -10 18 -2C20 6 -16 9 -16 0Z" fill="#000" opacity=".08"/><path d="M24 -3L84 -12L86 -6L26 4Z" fill="${c}"/></g>`,
  rice:(R,cx,cy,r,n,base='#f6f1e3')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${base}"/>`+many(n,()=>{const[x,y]=inDisc(R,cx,cy,r);return`<ellipse cx="${f(x)}" cy="${f(y)}" rx="3.3" ry="1.7" transform="rotate(${f(R()*180)} ${f(x)} ${f(y)})" fill="#fffdf7" stroke="#e5dccb" stroke-width=".6"/>`}),
  mound:(R,u,x,y,r,base='#f8f4e8')=>{const d=blob(R,x,y,r,10,.12);return`<path d="${d}" fill="${base}"/><clipPath id="md${u}${f(x)}"><path d="${d}"/></clipPath><g clip-path="url(#md${u}${f(x)})">${many(Math.round(r*1.4),()=>{const[gx,gy]=inDisc(R,x,y,r);return`<ellipse cx="${f(gx)}" cy="${f(gy)}" rx="3.2" ry="1.6" transform="rotate(${f(R()*180)} ${f(gx)} ${f(gy)})" fill="#fffef9" stroke="#e7dfcf" stroke-width=".6"/>`})}<path d="${d}" fill="url(#sh${u})"/></g>`},
  noodles:(R,cx,cy,r,n,c,dk,w,len=20,wob=1)=>many(n,()=>{const d=cr(walk(R,cx,cy,r,6,len,wob));return`<path d="${d}" stroke="${dk}" stroke-width="${w+1.6}" fill="none" stroke-linecap="round" opacity=".55"/><path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`}),

  egg:(R,u,x,y,r)=>`<path d="${blob(R,x,y,r,10,.18)}" fill="#fffdf6" stroke="#cf8f3d" stroke-width="3" stroke-opacity=".55"/>`+P.yolk(u,x+2,y-1,r*.38),
  leaf:(x,y,a,l,c)=>`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(a)})"><path d="M0 0C${l*.3} ${-l*.36} ${l*.72} ${-l*.3} ${l} 0C${l*.72} ${l*.3} ${l*.3} ${l*.36} 0 0Z" fill="${c}"/><path d="M1 0L${l*.86} 0" stroke="#fff" stroke-opacity=".28" stroke-width="1.1"/></g>`,
  chili:(x,y,r)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="#d02a17"/><circle cx="${f(x)}" cy="${f(y)}" r="${r*.55}" fill="#f4c08a"/><circle cx="${f(x)}" cy="${f(y)}" r="${r*.18}" fill="#f8e2b8"/>`,

  async function saveCapture(f, fromInline) {
    const { link, words } = C.parseCapture(f.text);
    if (!link && !words && !f.photo) return false;
    const now = C.iso(Date.now());
    let nm = '', note = (f.why || '').trim(); const guessed = {};
    if (link) { if (words && note) nm = words; else if (words) note = words; if (!nm && link.nameGuess) { nm = link.nameGuess; guessed.name = 'link'; } }
    else if (words) { if (words.length <= 60 && words.split(/\s+/).length <= 8) nm = words; else note = note ? `${words} · ${note}` : words; }
    const photo = f.photo ? await storePhoto(f.photo) : null;
    const src = { id: C.uid(), type: link ? link.type : f.photo ? 'photo' : 'text', url: link ? link.url : '', host: link ? link.host : '', note, at: now, photo: photo || null };
    const dup = link && dishes().find((d) => (d.sources || []).some((s) => s.url && s.url === link.url));
    const sameName = !dup && nm && dishes().find((d) => !d.sample && d.name && d.name.toLowerCase() === nm.toLowerCase());
    const base = dup || sameName;
    const isFirst = !dishes().some((d) => !d.sample);
    let dish;
    if (base) dish = { ...base, sources: [...base.sources, src], status: 'want', photo: base.photo || photo || null };
    else dish = { id: C.uid(), v: 2, name: nm, guessed, sources: [src], photo: photo || null, ingredients: [], status: 'want', createdAt: now };
    let ok = true;

    return true;
  }

  async function doImport(file) {
    const say = (m) => { if (sheet && sheet.kind === 'settings') { sheet.data.msg = m; drawSheet(); } };
    let j; try { j = JSON.parse(await file.text()); } catch { say("That file isn't readable JSON."); return; }
    const st = j.state && j.state.ideas ? j.state : j; const photos = j.photos || {};
    const rawDishes = j.dishes || st.ideas; const rawMeals = j.meals || st.meals || [];
    if (!Array.isArray(rawDishes)) { say("That file isn't a Nouri export."); return; }
    say('Importing…'); let n = 0, m = 0, k = 0;
    const pic = async (pid) => { const durl = pid && photos[pid]; if (typeof durl !== 'string' || !durl.startsWith('data:image/')) return null; try { const blob = await (await fetch(durl)).blob(); return await storePhoto(await readPhoto(blob)); } catch { return null; } };
    for (const raw of rawDishes) {
      if (!raw || !raw.id || D.dishes.has(raw.id)) continue; if (raw.source === 'starter' || raw.sample) continue;
      const d = C.normalizeDish(raw); if (raw.photoId) { const p = await pic(raw.photoId); if (p) d.photo = p; }
      try { await S.put('dishes', d); n++; say(`Importing… ${n} saves`); } catch { break; }
    }
    for (const raw of rawMeals) {

      try { await S.put('meals', me); m++; } catch { break; }
    }
    for (const raw of j.cooks || []) { if (raw && raw.id && !D.cooks.has(raw.id)) { try { await S.put('cooks', C.normalizeCook(raw)); k++; } catch { break; } } }
    const plans = (j.state && (j.state.plans || (j.state.week && j.state.week.options && j.state.week.options.map((o) => o.dishId)))) || st.plans || [];
    const keep = plans.filter((id) => D.dishes.has(id) && !weekHas(id));

  }

      case 'settings': openSheet('settings', {}); break;
      case 'retry': S.retry().then(() => drawSheet()); break;
      case 'rm-samples': { const ss = dishes().filter((d) => d.sample); for (const d of ss) S.del('dishes', d.id).catch(() => {}); const before = D.st.week; const opts = before.options.filter((o) => !ss.some((d) => d.id === o.dishId)); if (opts.length !== before.options.length) S.patch({ week: { ...before, options: opts } }); if (D.st.tonight && ss.some((d) => d.id === D.st.tonight.dishId)) S.patch({ tonight: null }); sheet.data.msg = 'Samples removed.'; drawSheet(); render(); break; }
      case 'import': $('#file-import').click(); break;
      case 'export': {
        const data = JSON.stringify(S.exportAll(), null, 2); const fn = `nouri-${new Date().toISOString().slice(0, 10)}.json`;
        if (cap.downloads) { try { await cap.downloads.save({ filename: fn, data }); sheet.data.msg = 'Exported.'; } catch (err) { sheet.data.msg = err && err.code === 'declined' ? 'Export cancelled.' : "Couldn't export from here."; } }
        else sheet.data.msg = "Export isn't available in this view. Open Nouri on claude.ai to export.";
        drawSheet(); break;
      }
    }
  });
  function readSheet() {
    if (!sheet) return; const f = sheet.data.f; const v = (s) => ($(s) ? $(s).value : null);
    if (sheet.kind === 'capture') { f.text = v('#cap-text') ?? f.text; f.why = v('#cap-why') ?? f.why; setDraft({ text: f.text, why: f.why }); }
    if (sheet.kind === 'log') { if (v('#l-title') !== null) f.title = v('#l-title'); if (v('#l-place') !== null) f.place = v('#l-place'); if (v('#l-note') !== null) f.note = v('#l-note'); }
    if (sheet.kind === 'finish') { if (v('#f-next') !== null) f.next = v('#f-next'); }
  }
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'sv-q') { R.q = t.value; const pos = t.selectionStart; renderSaved(); const n = $('#sv-q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch {} }
    if (t.id === 'cap-text' || t.id === 'cap-why') { readSheet(); const b = $('[data-act="save-capture"]'); if (b) b.disabled = !(sheet.data.f.text.trim() || sheet.data.f.photo); if (t.id === 'cap-text') { const had = !!$('.detected'); const has = !!C.parseCapture(t.value).link; if (had !== has) { const pos = t.selectionStart; drawSheet(); const n = $('#cap-text'); n.focus(); n.setSelectionRange(pos, pos); } } }
    if (t.id === 'cap-inline-text') { setDraft({ ...draft(), text: t.value }); const b = $('#cap-inline-save'); if (b) b.disabled = !t.value.trim(); }
    if (t.id === 'l-title') { const b = $('[data-act="save-log"]'); if (b) b.disabled = !t.value.trim(); }
  });
  document.addEventListener('submit', async (e) => {
    if (e.target.id === 'g-add') { e.preventDefault(); const v = $('#g-in').value.trim(); if (!v) return; const g = D.st.groceries; S.patch({ groceries: { ...g, extras: [...(g.extras || []), { key: C.ingredientKey(v), name: v }] } }); renderWeek(); const n = $('#g-in'); n && n.focus(); }
    if (e.target.id === 'cap-inline') { e.preventDefault(); const t = $('#cap-inline-text'); const b = $('#cap-inline-save'); if (!t.value.trim()) return; b.disabled = true; b.innerHTML = '<span class="spin"></span>'; await saveCapture({ text: t.value, why: '', photo: null }, true); render(); }
    if (e.target.id === 'cook-form') { e.preventDefault(); const n = $('#cook-note'); const v = n.value.trim(); if (!v) return; n.value = ''; await addEntry(v, null); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (sheet) closeSheet(); else if (cookId) closeCook(); }
    if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'cap-inline-text') { e.preventDefault(); $('#cap-inline').requestSubmit(); }
  });
  $('#toast-undo').addEventListener('click', () => { const u = tUndo; tUndo = null; $('#toast').classList.remove('on'); u && u(); });
  $('#file-photo').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; const cb = photoCb; photoCb = null; if (f && cb) cb(f); });
  $('#file-import').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) doImport(f); });

  /* ================= Boot ================= */
  async function boot() {
    const use = window.claude && window.claude.use;
    let runtime = null;
    if (use) {
      try { const [db, user] = await Promise.all([use('db'), use('user')]); const uid = user && (await user.id()); if (db && uid) runtime = { db, userId: uid }; } catch {}
      use('sample').then((s) => { cap.sample = s; if (s) s.limits().then((l) => { cap.imgs = !!(l && l.images); }).catch(() => {}); render(); }).catch(() => {});
      use('assets').then((a) => { cap.assets = a; }).catch(() => {});
      use('downloads').then((d) => { cap.downloads = d; }).catch(() => {});
    }
    S.subscribe(() => { render(); if (cookId && !pendingEntry) { const f = document.activeElement && document.activeElement.id === 'cook-note'; renderCook(); if (f) $('#cook-note').focus(); } if (sheet && (sheet.kind === 'dish' || sheet.kind === 'meal' || sheet.kind === 'settings')) drawSheet(); });
    renderToday();
    await S.boot(runtime);
    go('today');
    const ac = activeCook(); if (ac && sessionStorage.getItem('nouri-cook-open') === ac.id) openCook(ac.id);
  }
  addEventListener('visibilitychange', () => { try { if (cookId) sessionStorage.setItem('nouri-cook-open', cookId); else sessionStorage.removeItem('nouri-cook-open'); } catch {} });
  window.NouriUI = { go, render, state: R };
  boot();
})();

</script>
